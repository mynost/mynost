name: Publish crypto short dashboard
on:
  push:
    branches: [main]
    paths:
      - 'crypto-short-dashboard/**'
      - '.github/workflows/crypto-dashboard-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: crypto-dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/crypto-short-dashboard
          cp crypto-short-dashboard/index.html _site/crypto-short-dashboard/index.html
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=crypto-short-dashboard/"><a href="crypto-short-dashboard/">Open dashboard</a>' > _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
